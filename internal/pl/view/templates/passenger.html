<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart City Transportation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  {{template "brand"}}
  <span class="spacer"></span>
  <span class="who" id="who">{{if .Session.Email}}{{.Session.Email}}{{else}}Guest{{end}}</span>
  <button id="share-loc" class="btn small secondary" type="button">Share my location</button>
  <button id="test-loc" class="btn small secondary" type="button" title="Click on the map to simulate where you are">Test location</button>
  {{if .Session.Email}}<button id="logout" class="btn small ghost" type="button">Sign out</button>
  {{else}}<a class="btn small ghost" href="/login">Sign in</a>
  <a class="btn small" href="/register">Register</a>{{end}}
</header>
<main class="layout">
  <aside class="panel" aria-label="Buses">
    <section id="testloc" class="card testloc hidden" aria-live="polite">
      <div class="card-title">
        <h2><span class="pin" aria-hidden="true"></span>&nbsp; Test location</h2>
        <button id="testloc-clear" class="btn small ghost" type="button">Clear</button>
      </div>
      <p class="help" id="testloc-hint">Drag the pin to move it. It replaces your GPS position for sharing, reports and ETA.</p>
      <div id="testloc-info"></div>
    </section>

    <input id="search" class="input search" type="search" placeholder="Search bus or route, e.g. 65" aria-label="Search buses">

    <section id="bus-detail" class="card hidden" aria-live="polite">
      <button id="d-close" class="btn small ghost" type="button">&larr; All buses</button>
      <div class="detail-head"><h2 id="d-name"></h2><span id="d-density" class="badge"></span></div>
      <p class="meta" id="d-route"></p>
      <p class="meta" id="d-pass"></p>
      <div id="d-temp" class="banner hidden"></div>
      <h3>How crowded is it?</h3>
      <div class="row gap" role="group" aria-label="Report density">
        <button class="btn small secondary" type="button" data-density="low"><span class="dot d-low" aria-hidden="true"></span>Low</button>
        <button class="btn small secondary" type="button" data-density="medium"><span class="dot d-medium" aria-hidden="true"></span>Medium</button>
        <button class="btn small secondary" type="button" data-density="high"><span class="dot d-high" aria-hidden="true"></span>High</button>
      </div>
      <p id="d-msg" class="help"></p>
      <h3>Stops · select one for ETA</h3>
      <ol id="d-stops" class="stops"></ol>
    </section>

    <section class="card flush" id="bus-list-card">
      <div class="card-title"><h2>Buses</h2><span class="muted small-text" id="bus-count"></span></div>
      <div id="bus-list" class="list" aria-busy="true">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>
  </aside>
  <div id="map" class="map" role="region" aria-label="Map"></div>
</main>
<div id="toast" class="toast hidden" role="status"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/common.js"></script>
<script src="/static/passenger.js"></script>
</body>
</html>
